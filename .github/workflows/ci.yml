name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # the hosted build, as Cloudflare makes it (no sourcemaps, no local paths)
      - run: npm run build
      - run: "! find apps/web/dist -name '*.map' | grep -q . && ! grep -rq 'tools/bridge/src/main.ts' apps/web/dist"
