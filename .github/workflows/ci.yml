name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # the package as `npx github:hoihu/tracewise` builds it (npm ci ran prepare): no sourcemaps, no local paths, and it starts
      - run: "! find dist -name '*.map' | grep -q . && ! grep -rq 'tools/bridge/src/main.ts' dist/app"
      - run: node dist/tracewise.js --version
