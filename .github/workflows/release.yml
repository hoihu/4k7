# When a version tag (v0.1.0) is pushed: builds the downloadable app (scripts/bundle.mjs) and attaches
# it to a GitHub release, which 4k7.dev links to (…/releases/latest/download/<file>). The release's notes are
# the version's section of CHANGELOG.md, then GitHub's list of pull requests. See docs/distribution.md.
#
# The npm job is inert until the package is published: "private": true in package.json makes npm refuse
# to publish, and npm must trust this workflow (npmjs.com → package settings → Trusted publishing:
# hoihu/4k7, release.yml).
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write # the release and its files
  id-token: write # npm trusted publishing and provenance

jobs:
  bundles:
    # macOS for hdiutil (the DMGs); the Linux archives are built on the same run
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: The tag matches the version in package.json, and CHANGELOG.md has its notes
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME, package.json $v"; exit 1; }
          node scripts/changelog.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/bundle.mjs
      - name: Attach to the release (created here if the tag has none; pre-releases are marked)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="build/4k7-macos-arm64.dmg build/4k7-macos-x64.dmg build/4k7-linux-x64.tar.gz build/4k7-linux-arm64.tar.gz"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload --clobber "$GITHUB_REF_NAME" $files
          else
            case "$GITHUB_REF_NAME" in *-*) pre=--prerelease;; *) pre=;; esac
            # CHANGELOG.md's notes (a pre-release may have none), followed by GitHub's list of pull requests
            node scripts/changelog.mjs notes "$GITHUB_REF_NAME" > build/notes.md || [ -n "$pre" ]
            gh release create "$GITHUB_REF_NAME" --notes-file build/notes.md --generate-notes $pre $files
          fi

  publish:
    if: false # not published to npm yet; see docs/distribution.md
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5+
      - run: npm install -g npm@latest
      - run: npm ci
      - name: The tag matches the version in package.json
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME, package.json $v"; exit 1; }
      # prepublishOnly runs typecheck, tests and the package check; prepare builds dist/.
      # Pre-releases (0.2.0-beta.1) go to the `next` dist-tag, so `npx 4k7pcb` keeps the last release.
      - run: npm publish --provenance --access public --tag "$(case "$GITHUB_REF_NAME" in *-*) echo next;; *) echo latest;; esac)"
